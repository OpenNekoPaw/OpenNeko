name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  promotion-source:
    name: Validate development branch to main promotion
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate promotion source
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: node scripts/test-orchestration/assert-promotion-source.mjs

  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/cache@v5
        if: ${{ env.ACT != 'true' }}
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Install media runtime dependency
        if: ${{ env.ACT != 'true' || env.ACT_NATIVE_DEPS_READY != 'true' }}
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < scripts/act/media-runtime-packages.txt

      - run: pnpm check:build

  local-metadata-runtime:
    name: Local Metadata Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:local-metadata-runtimes -- --probe-bun
      - run: pnpm --dir packages/neko-types exec vitest run src/vscode/extension/__tests__/node-sqlite-local-metadata-store.test.ts
      - run: pnpm --filter @neko/app-tui test:sqlite:bun
      - run: pnpm --filter @neko/app-tui build

  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/cache@v5
        if: ${{ env.ACT != 'true' }}
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Install media runtime dependency
        if: ${{ env.ACT != 'true' || env.ACT_NATIVE_DEPS_READY != 'true' }}
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < scripts/act/media-runtime-packages.txt

      - name: Run TypeScript tests
        run: |
          if [ "${ACT:-}" = "true" ]; then
            pnpm exec turbo run test --concurrency=1 --continue=always -- --coverage
          else
            pnpm check:test
          fi

      - uses: actions/upload-artifact@v6
        if: ${{ always() && env.ACT != 'true' }}
        with:
          name: coverage-reports
          path: packages/**/coverage/
          retention-days: 14

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/cache@v5
        if: ${{ env.ACT != 'true' }}
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository-quality

  openspec-check:
    name: OpenSpec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:openspec

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure

  package-openneko-vsix:
    name: Package OpenNeko VSIX (${{ matrix.target }})
    needs: [build, test-ts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Verify retired media runtime is absent from product composition
        run: pnpm check:engine-retirement-boundary

      - name: Build verified FFmpeg runtime
        run: scripts/build-media-runtime.sh ${{ matrix.target }} .tmp/release-media-runtime/${{ matrix.target }}

      - name: Assemble OpenNeko platform VSIX
        run: node scripts/package-openneko-platform.mjs --target ${{ matrix.target }}
        env:
          NEKO_MEDIA_RUNTIME_ROOT: ${{ github.workspace }}/.tmp/release-media-runtime/${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: openneko-vsix-${{ matrix.target }}
          path: vsix-artifacts/OpenNeko-${{ matrix.target }}-*.vsix
          retention-days: 30

  manual-gate:
    name: Manual Gate
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - build
      - local-metadata-runtime
      - test-ts
      - code-quality
      - openspec-check
      - package-openneko-vsix
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Assert required manual jobs
        env:
          CI_GATE_RESULTS: ${{ toJson(needs) }}
        run: >-
          node scripts/test-orchestration/assert-ci-gate-results.mjs
          "Manual Gate"
          build
          local-metadata-runtime
          test-ts
          code-quality
          openspec-check
          package-openneko-vsix

  merge-gate:
    name: Merge Gate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - build
      - local-metadata-runtime
      - test-ts
      - code-quality
      - openspec-check
      - package-openneko-vsix
      - promotion-source
      - dependency-review
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Assert required merge jobs
        env:
          CI_GATE_RESULTS: ${{ toJson(needs) }}
        run: >-
          node scripts/test-orchestration/assert-ci-gate-results.mjs
          "Merge Gate"
          build
          local-metadata-runtime
          test-ts
          code-quality
          openspec-check
          package-openneko-vsix
          promotion-source
          dependency-review
