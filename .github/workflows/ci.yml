name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-source:
    name: Validate development branch to main promotion
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Validate promotion source
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: node scripts/test-orchestration/assert-promotion-source.mjs

  static-build:
    name: Host-neutral Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Install media runtime dependency
        if: ${{ env.ACT != 'true' || env.ACT_NATIVE_DEPS_READY != 'true' }}
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < scripts/act/media-runtime-packages.txt

      - name: Run host-neutral build checks
        run: pnpm check:static-build

  platform-test:
    name: Platform Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Typecheck Desktop
        run: pnpm typecheck:desktop

      - name: Validate local metadata runtime
        run: pnpm check:local-metadata-runtimes

      - name: Test local metadata store
        run: pnpm --dir packages/local-metadata exec vitest run src/node-sqlite-local-metadata-store.test.ts

      - name: Run platform orchestration tests
        run: >-
          node --test
          scripts/test-orchestration/desktop-build-platforms.test.mjs
          scripts/test-orchestration/local-metadata-runtime-matrix.test.mjs
          scripts/test-orchestration/sharp-cjs-bundle-runtime.test.mjs

  test-ts:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Install media runtime dependency
        if: ${{ env.ACT != 'true' || env.ACT_NATIVE_DEPS_READY != 'true' }}
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < scripts/act/media-runtime-packages.txt

      - name: Run unit and contract tests
        run: |
          if [ "${ACT:-}" = "true" ]; then
            pnpm --recursive --if-present --sort --no-bail --workspace-concurrency=1 run test -- --coverage
          else
            pnpm check:test
          fi

      - uses: actions/upload-artifact@v6
        if: ${{ always() && env.ACT != 'true' }}
        with:
          name: coverage-reports
          path: packages/**/coverage/
          retention-days: 14

  functional-test:
    name: Desktop Headless Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Run headless Desktop functional tests
        run: pnpm test:functional:headless

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository-quality

  openspec-check:
    name: OpenSpec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:openspec

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure

  manual-gate:
    name: Manual Gate
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - static-build
      - platform-test
      - test-ts
      - functional-test
      - code-quality
      - openspec-check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Assert required manual jobs
        env:
          CI_GATE_RESULTS: ${{ toJson(needs) }}
        run: >-
          node scripts/test-orchestration/assert-ci-gate-results.mjs
          "Manual Gate"
          static-build
          platform-test
          test-ts
          functional-test
          code-quality
          openspec-check

  merge-gate:
    name: Merge Gate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - static-build
      - platform-test
      - test-ts
      - functional-test
      - code-quality
      - openspec-check
      - promotion-source
      - dependency-review
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Assert required merge jobs
        env:
          CI_GATE_RESULTS: ${{ toJson(needs) }}
        run: >-
          node scripts/test-orchestration/assert-ci-gate-results.mjs
          "Merge Gate"
          static-build
          platform-test
          test-ts
          functional-test
          code-quality
          openspec-check
          promotion-source
          dependency-review
