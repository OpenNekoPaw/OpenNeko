packages:
  - apps/*
  - packages/*
  - packages/*/*

shamefullyHoist: true
publicHoistPattern:
  - '*react-markdown*'
  - '*remark*'
  - '*unified*'
  - '*prism*'

overrides:
  '@electron/node-gyp': https://codeload.github.com/electron/node-gyp/tar.gz/06b29aafb7708acef8b3669835c8a7857ebc92d2
  '@deepseek-ai/dsh-atomic-write': 0.1.1-rc.2
  '@deepseek-ai/dsh-brand': 0.1.1-rc.2
  '@deepseek-ai/dsh-code-runtime': 0.1.1-rc.2
  '@deepseek-ai/dsh-credentials': 0.1.1-rc.2
  '@deepseek-ai/dsh-home-paths': 0.1.1-rc.2
  '@deepseek-ai/dsh-invariants': 0.1.1-rc.2
  '@deepseek-ai/dsh-launch-environment': 0.1.1-rc.2
  '@deepseek-ai/dsh-sandbox': 0.1.1-rc.2
  '@deepseek-ai/dsh-scope': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-projection': 0.1.1-rc.2
  '@deepseek-ai/dsh-settings': 0.1.1-rc.2
  '@deepseek-ai/dsh-shell': 0.1.1-rc.2
  '@deepseek-ai/dsh-subprocess': 0.1.1-rc.2
  '@deepseek-ai/dsh-timeout': 0.1.1-rc.2
  '@deepseek-ai/dsh-typert-protocol': 0.1.1-rc.2
  adm-zip: ^0.6.0
  '@vitejs/plugin-react': 5.1.4
  '@vitest/coverage-v8': 4.1.2
  d3-array: ^3.2.4
  d3-shape: ^3.2.0
  d3-selection: ^3.0.0
  d3-transition: ^3.0.0
  d3-interpolate: ^3.0.0
  d3-color: ^3.1.0
  d3-format: ^3.1.0
  d3-path: ^3.1.0
  vite: 7.3.6
  vite-plugin-static-copy: 4.0.1
  vitest: 4.1.2

packageExtensions:
  '@electron-forge/plugin-fuses@7.11.2':
    peerDependencies:
      '@electron/fuses': ^1.0.0 || ^2.0.0

ignoredBuiltDependencies:
  - esbuild
  - sharp

allowBuilds:
  '@fission-ai/openspec': set this to true or false
  core-js: set this to true or false
  electron: true
  es5-ext: set this to true or false
  esbuild: set this to true or false
  fs-xattr: true
  keytar: set this to true or false
  macos-alias: true
  sharp: set this to true or false
  tesseract.js: set this to true or false

patchedDependencies:
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
