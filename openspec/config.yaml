schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - OpenSpec is only for an independently named system-level or product-level capability that changes a system boundary, core product workflow, durable user fact, or security/trust boundary.
    - Do not create a proposal for local UI or interaction details, bug fixes, performance work, refactors, cleanup, package or directory moves, internal contract changes, tests, quality gates, build/dependency/tooling, inventory, audit, or status work; implement them directly in code and tests.
    - Keep the proposal at product intent and system-boundary level. Do not include implementation inventories, file/class/function plans, command logs, dated evidence, or code-progress history.
    - When a change touches apps/* or packages/* production modules, Impact must identify the owning responsibility and affected package role; a Desktop-only caller is not ownership evidence.
    - After a completed feature change promotes its current requirements to canonical specs or architecture documents, delete the proposal directory; do not retain completed proposal history under openspec/changes/archive.
  design:
    - Record only stable owners, runtime/trust boundaries, core contracts, user-data impact, failure isolation, and product-level tradeoffs; code remains authoritative for modules, files, types, and control flow.
  tasks:
    - Keep only a few product-level milestones and final acceptance outcomes. Do not track files, classes/functions, per-commit steps, commands, dated evidence, or implementation progress.
    - Delete the proposal when code owns the canonical capability and only local fixes or supplemental validation remain.
